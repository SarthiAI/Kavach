name: Publish Node SDK to npm

on:
  push:
    tags:
      - 'kavach-sdk-v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build only, do not publish (test the matrix)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            target: aarch64-apple-darwin
            cross: false
          - host: macos-13
            target: x86_64-apple-darwin
            cross: false
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kavach-node/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross-compile toolchain (Linux arm64)
        if: matrix.cross && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install npm deps
        working-directory: kavach-node
        run: npm install --no-audit --no-fund

      - name: Build native binary
        working-directory: kavach-node
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: List built binaries
        working-directory: kavach-node
        run: ls -la *.node

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: kavach-node/kavach-engine.*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: kavach-node/artifacts

      - name: Move binaries to engine root
        run: |
          mv kavach-node/artifacts/*/*.node kavach-node/
          ls -la kavach-node/*.node

      - name: Install npm deps (engine)
        working-directory: kavach-node
        run: npm install --no-audit --no-fund

      - name: Generate and publish per-platform binary packages
        working-directory: kavach-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx napi prepublish -t npm --skip-gh-release

      - name: Publish main kavach-engine package
        working-directory: kavach-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Install npm deps (SDK wrapper)
        working-directory: kavach-node/npm
        run: npm install --no-audit --no-fund

      - name: Build SDK wrapper TypeScript
        working-directory: kavach-node/npm
        run: npm run build

      - name: Publish kavach-sdk wrapper
        working-directory: kavach-node/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
