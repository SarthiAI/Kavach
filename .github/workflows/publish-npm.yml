name: Publish Node SDK to npm

on:
  push:
    tags:
      - 'node-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm deps
        working-directory: kavach-node
        run: npm install --no-audit --no-fund

      - name: Build native binary
        working-directory: kavach-node
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: kavach-node/kavach-engine.*.node
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [build-binaries]
    environment:
      name: release
      url: https://www.npmjs.com/package/kavach-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: kavach-node/artifacts
          pattern: binary-*

      - name: Install npm deps (engine)
        working-directory: kavach-node
        run: npm install --no-audit --no-fund

      - name: Reorganize artifacts into napi bindings-<triple> layout
        working-directory: kavach-node
        run: |
          find artifacts -name '*.node' -exec mv {} artifacts/ \;
          find artifacts -mindepth 1 -type d -empty -delete
          mkdir -p artifacts/bindings-aarch64-apple-darwin
          mv artifacts/kavach-engine.darwin-arm64.node       artifacts/bindings-aarch64-apple-darwin/
          mkdir -p artifacts/bindings-x86_64-unknown-linux-gnu
          mv artifacts/kavach-engine.linux-x64-gnu.node      artifacts/bindings-x86_64-unknown-linux-gnu/
          mkdir -p artifacts/bindings-aarch64-unknown-linux-gnu
          mv artifacts/kavach-engine.linux-arm64-gnu.node    artifacts/bindings-aarch64-unknown-linux-gnu/
          mkdir -p artifacts/bindings-x86_64-pc-windows-msvc
          mv artifacts/kavach-engine.win32-x64-msvc.node     artifacts/bindings-x86_64-pc-windows-msvc/
          ls -R artifacts/

      - name: Move artifacts into per-platform npm packages
        working-directory: kavach-node
        run: npx napi artifacts -d artifacts

      - name: List npm packages after artifacts
        working-directory: kavach-node
        run: |
          ls -la npm/
          for d in npm/*/; do
            echo "--- $d ---"
            ls -la "$d"
          done

      - name: Publish per-platform binary packages
        working-directory: kavach-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx napi prepublish -t npm --skip-gh-release

      - name: Publish main kavach-engine package
        working-directory: kavach-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Install npm deps (SDK wrapper)
        working-directory: kavach-node/npm
        run: npm install --no-audit --no-fund

      - name: Build SDK wrapper TypeScript
        working-directory: kavach-node/npm
        run: npm run build

      - name: Publish kavach-sdk wrapper
        working-directory: kavach-node/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
